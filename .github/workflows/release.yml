name: Release

# Läuft, sobald du einen Tag der Form v1.0.0 pushst:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag zum Veröffentlichen (z.B. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    # Secrets lassen sich in "if:" nicht zuverlässig direkt abfragen -
    # deshalb erst auf env mappen und dann env prüfen.
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace --no-daemon

      - name: Read versions from gradle.properties
        id: props
        run: |
          echo "mc=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "mod=$(grep '^version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: DonutMarket ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            **Minecraft ${{ steps.props.outputs.mc }} · Fabric**

            Benötigt Fabric Loader 0.19.3+ und Fabric API.
            Nach der Installation ingame `/api` ausführen und den Key mit
            `/dm key <key>` eintragen.
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      # Optional: automatisch auf Modrinth hochladen.
      # Erst aktiv, wenn du in den Repo-Settings ein Secret MODRINTH_TOKEN
      # und eine Variable MODRINTH_PROJECT_ID hinterlegst.
      - name: Publish to Modrinth
        if: env.MODRINTH_TOKEN != '' && env.MODRINTH_PROJECT_ID != ''
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          game-versions: ${{ steps.props.outputs.mc }}
          loaders: fabric
          dependencies: |
            fabric-api(required)
          version-type: release
