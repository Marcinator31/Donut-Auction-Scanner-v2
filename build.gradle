plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = "donutmarket"
}

repositories {
	// Minecraft + Fabric-Repos fuegt Loom automatisch hinzu.
}

dependencies {
	// Ab 26.1 ist Minecraft unobfuskiert ausgeliefert -> KEINE "mappings"-Zeile
	// und "implementation" statt "modImplementation". Genau so macht es auch
	// das offizielle fabric-example-mod im Branch 26.2.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def v = project.version
	inputs.property "version", v

	filesMatching("fabric.mod.json") {
		expand "version": v
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
